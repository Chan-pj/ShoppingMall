<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">

    <style>
        :root {
            --bg: #e8ece4;
            --surface: #ffffff;
            --field: #f4f6f1;
            --ink: #16302a;
            --ink-soft: #56675f;
            --line: #d3dbd2;
            --tag: #f3c64b;
            --ok: #2f7a4f;
            --err: #c23b2a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            background: var(--bg);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: min(420px, calc(100% - 32px));
            margin: 80px auto;
            background: var(--surface);
            padding: 44px 40px 36px;
            border-radius: 6px;
            border-top: 6px solid var(--ink);
            box-shadow: 0 30px 60px -30px rgba(22, 48, 42, 0.35);
        }

        h1 {
            margin: 0 0 32px;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-soft);
        }

        input {
            width: 100%;
            padding: 13px 14px;
            background: var(--field);
            border: 1.5px solid transparent;
            border-radius: 6px;
            font: inherit;
            font-size: 15px;
            color: var(--ink);
            transition: border-color .15s, background .15s;
        }

        input::placeholder { color: #9aa69f; }

        input:focus {
            outline: none;
            background: #fff;
            border-color: var(--ink);
        }

        input:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .auth-row { display: flex; gap: 8px; }
        .auth-row input { flex: 1; min-width: 0; }

        button {
            border: none;
            border-radius: 6px;
            padding: 13px 16px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: background .15s, color .15s;
        }

        button:focus-visible,
        a:focus-visible {
            outline: 3px solid var(--tag);
            outline-offset: 2px;
        }

        .auth-button {
            background: transparent;
            color: var(--ink);
            box-shadow: inset 0 0 0 1.5px var(--ink);
            white-space: nowrap;
        }

        .auth-button:hover { background: var(--ink); color: #fff; }

        .auth-button:disabled {
            color: #9aa69f;
            box-shadow: inset 0 0 0 1.5px var(--line);
            background: transparent;
            cursor: not-allowed;
        }

        .verify-button {
            width: 100%;
            margin-top: 10px;
            background: var(--ok);
            color: #fff;
        }

        .verify-button:hover { background: #256440; }

        .login-button {
            width: 100%;
            margin-top: 12px;
            padding: 16px;
            background: var(--ink);
            color: #fff;
            font-size: 16px;
        }

        .login-button:hover { background: #0e211c; }

        .verify-button:disabled,
        .login-button:disabled {
            background: #d6ddd6;
            color: #87948d;
            cursor: not-allowed;
        }

        .test-code {
            display: none;
            margin-top: 12px;
            padding: 12px 14px;
            background: #fdf4d3;
            border-left: 4px solid var(--tag);
            border-radius: 0 6px 6px 0;
            color: #5c4a0c;
            font-size: 14px;
        }

        .test-code strong {
            margin-left: 4px;
            font-size: 18px;
            letter-spacing: .2em;
            font-variant-numeric: tabular-nums;
        }

        .timer {
            margin-top: 8px;
            font-size: 13px;
            font-weight: 700;
            color: var(--err);
            font-variant-numeric: tabular-nums;
        }

        .message { margin-top: 10px; font-size: 14px; }
        .success { color: var(--ok); }
        .error { color: var(--err); }

        .back {
            display: block;
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
            color: var(--ink-soft);
            text-underline-offset: 4px;
        }

        .back:hover { color: var(--ink); }

        @media (max-width: 480px) {
            .container { margin: 32px auto; padding: 36px 24px 28px; }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>로그인</h1>

    <form id="loginForm">

        <div class="form-group">
            <label for="id">아이디</label>
            <input type="text" id="id" name="id" required>
        </div>

        <div class="form-group">
            <label for="phone">전화번호</label>
            <input type="text" id="phone" name="phone" placeholder="01012345678" required>
        </div>

        <div class="form-group">
            <label>인증번호</label>

            <div class="auth-row">
                <input type="text" id="authCode" maxlength="6" placeholder="인증번호 입력" disabled>
                <button type="button" id="requestButton" class="auth-button" onclick="requestAuthCode()">
                    인증번호 받기
                </button>
            </div>

            <div id="testAuthCode" class="test-code"></div>
            <div id="timer" class="timer"></div>

            <button type="button" id="verifyButton" class="verify-button" onclick="verifyAuthCode()" disabled>
                인증번호 확인
            </button>

            <div id="message" class="message"></div>
        </div>

        <button type="submit" id="loginButton" class="login-button" disabled>
            로그인
        </button>

    </form>

    <a href="/" class="back">메인으로 돌아가기</a>

</div>


<script>

    let timerInterval = null;
    let verified = false;


    // 로그인 인증번호 받기
    function requestAuthCode() {

        const id = document.getElementById("id").value.trim();
        const phone = document.getElementById("phone").value.trim();

        if (!id || !phone) {
            showMessage("아이디와 전화번호를 입력해주세요.", "error");
            return;
        }

        const formData = new URLSearchParams();
        formData.append("id", id);
        formData.append("phone", phone);

        fetch("/user/login/auth", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData
        })
        .then(response => response.text())
        .then(result => {

            if (result === "USER_NOT_FOUND") {
                showMessage("아이디와 전화번호가 일치하지 않습니다.", "error");
                return;
            }

            if (result === "ERROR") {
                showMessage("인증번호 발급 중 오류가 발생했습니다.", "error");
                return;
            }

            document.getElementById("testAuthCode").innerHTML =
                "테스트용 인증번호 : <strong>" + result + "</strong>";
            document.getElementById("testAuthCode").style.display = "block";

            document.getElementById("authCode").disabled = false;
            document.getElementById("verifyButton").disabled = false;
            document.getElementById("requestButton").innerText = "재발급";

            showMessage("인증번호가 발급되었습니다.", "success");

            startTimer();
        })
        .catch(error => {
            console.error(error);
            showMessage("서버와 통신할 수 없습니다.", "error");
        });
    }


    // 로그인 인증번호 확인
    function verifyAuthCode() {

        const id = document.getElementById("id").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const authCode = document.getElementById("authCode").value.trim();

        if (!authCode) {
            showMessage("인증번호를 입력해주세요.", "error");
            return;
        }

        const formData = new URLSearchParams();
        formData.append("id", id);
        formData.append("phone", phone);
        formData.append("authCode", authCode);

        fetch("/user/login/verify", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData
        })
        .then(response => response.text())
        .then(result => {

            if (result === "SUCCESS") {

                verified = true;
                stopTimer();

                document.getElementById("authCode").disabled = true;
                document.getElementById("verifyButton").disabled = true;
                document.getElementById("requestButton").disabled = true;
                document.getElementById("loginButton").disabled = false;

                showMessage("인증이 완료되었습니다.", "success");

            } else if (result === "FAIL") {
                showMessage("인증번호가 올바르지 않거나 만료되었습니다.", "error");

            } else if (result === "USER_NOT_FOUND") {
                showMessage("아이디와 전화번호가 일치하지 않습니다.", "error");

            } else {
                showMessage("로그인 처리 중 오류가 발생했습니다.", "error");
            }
        })
        .catch(error => {
            console.error(error);
            showMessage("서버와 통신할 수 없습니다.", "error");
        });
    }


    // 로그인 성공
    document.getElementById("loginForm").addEventListener("submit", function(event) {

        event.preventDefault();

        if (!verified) {
            showMessage("전화번호 인증을 먼저 완료해주세요.", "error");
            return;
        }

        window.location.href = "/user/result?type=login";
    });


    // 3분 타이머
    function startTimer() {

        stopTimer();

        let remaining = 180;
        updateTimer(remaining);

        timerInterval = setInterval(function() {

            remaining--;
            updateTimer(remaining);

            if (remaining <= 0) {
                stopTimer();
                document.getElementById("requestButton").disabled = false;
                document.getElementById("verifyButton").disabled = true;
                showMessage("인증번호가 만료되었습니다. 다시 발급해주세요.", "error");
            }

        }, 1000);
    }

    function updateTimer(seconds) {
        const minute = Math.floor(seconds / 60);
        const second = seconds % 60;
        document.getElementById("timer").innerText =
            "남은 시간 : " + minute + ":" + String(second).padStart(2, "0");
    }

    function stopTimer() {
        if (timerInterval !== null) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        document.getElementById("timer").innerText = "";
    }

    function showMessage(message, type) {
        const element = document.getElementById("message");
        element.innerText = message;
        element.className = "message " + type;
    }

</script>

</body>
</html>
